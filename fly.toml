# LEARN (sprint 15): a Fly.io app config (Render/Railway are analogous). Declares
# how the platform runs the API: the image, health checks, and how instances
# start. PaaS is chosen over Kubernetes on purpose (ADR 0030) — it keeps the
# curriculum on the concepts that transfer (release phases, health checks, env)
# without the k8s learning cliff.
app = "gitjira-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

# The process that runs on every instance. Runs DB migrations, then the server.
[processes]
  app = "sh -c 'npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node src/server.js'"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    path = "/api/health"
    interval = "15s"
    timeout = "2s"

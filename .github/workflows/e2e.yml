name: E2E

# LEARN (sprint 11): E2E runs on a SCHEDULE + on-demand, NOT on every PR. A
# ~2-minute browser suite shouldn't gate a one-line docs change, and browser
# flake shouldn't block unrelated work. The fast layers (unit/integration) gate
# PRs in ci.yml; this catches whole-journey regressions nightly. See ADR 0024.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC nightly

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gitjira
          POSTGRES_PASSWORD: gitjira_dev
          POSTGRES_DB: gitjira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitjira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gitjira:gitjira_dev@localhost:5432/gitjira_test
      JWT_SECRET: e2e-secret
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Build web (dev server is started by Playwright's webServer)
        run: npm run build -w @gitjira/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload report + traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

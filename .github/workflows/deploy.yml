name: Deploy

# LEARN (sprint 15): two deploy paths, two risk levels.
# - STAGING auto-deploys on every push to main (fast feedback, low blast radius).
# - PROD deploys only on a version TAG and only after a human approves in the
#   'production' GitHub Environment. The approval gate is a deliberate pause: a
#   person confirms "yes, ship THIS to customers" — the one manual step that's
#   worth its friction.
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --app gitjira-api-staging --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # <- requires a manual approval (configured in repo settings)
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --app gitjira-api --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

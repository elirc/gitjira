name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # LEARN: a service container is a real Postgres booted next to the job —
    # integration tests in CI hit the same database engine as production.
    # Mock-free confidence, ~5 seconds of startup.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gitjira
          POSTGRES_PASSWORD: gitjira_dev
          POSTGRES_DB: gitjira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitjira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gitjira:gitjira_dev@localhost:5432/gitjira_test
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

name: Secrets

# LEARN (sprint 13): gitleaks scans the diff for committed secrets — API keys,
# tokens, private keys — and fails the PR before they land. A secret in git
# history is compromised forever (rewriting history doesn't un-leak it from every
# clone and fork), so the only real defense is catching it BEFORE the commit
# merges. Runs on every PR.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan sees the whole diff range
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Secrets

# LEARN (sprint 13): gitleaks scans for committed secrets — API keys, tokens,
# private keys — and fails the PR before they land. A secret in git history is
# compromised forever (rewriting history doesn't un-leak it from clones and
# forks), so the only real defense is catching it BEFORE merge.
#
# We scan the working TREE (--no-git) with our own .gitleaks.toml rather than the
# full history: deterministic, uses our allowlist for test/demo fixtures, and
# doesn't re-litigate every historical commit on every PR.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose

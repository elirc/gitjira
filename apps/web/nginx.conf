# LEARN (sprint 15): the prod equivalent of Vite's dev proxy. nginx serves the
# static build and forwards /api and /socket.io to the API container. The
# try_files line is the SPA fallback — any unknown path returns index.html so
# client-side routing (react-router) works on a hard refresh / deep link.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
